[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-data-ai"
version = "0.1.0"
description = "Jupyter-oriented AI data notebook toolkit for policy data sources."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "policy_data_ai" }]
dependencies = [
  "pandas>=2.2.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["policy_data_ai*"]

